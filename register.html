<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>إنشاء حساب | فرصتي</title><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/app.js"></script></head><body class="auth-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">ف</span><span>فرصتي</span></a><a href="index.html">العودة للرئيسية</a></div></header><main class="auth-wrap"><form id="registerForm" class="auth-card"><span class="eyebrow">ابدأ رحلتك المهنية</span><h1>إنشاء حساب جديد</h1><p class="muted">سجّل بياناتك لتتمكن من التقديم على الوظائف.</p><div id="formMessage" class="message"></div><label>الاسم الكامل<input name="name" required maxlength="150" autocomplete="name" placeholder="اكتب اسمك الكامل"></label><label>البريد الإلكتروني<input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label><label>رقم الهاتف<input name="phone" type="tel" placeholder="رقم الهاتف"></label><label>كلمة المرور<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل"></label><button class="btn btn-block" type="submit">إنشاء الحساب</button><p class="auth-bottom">لديك حساب بالفعل؟ <a href="login.html">سجّل الدخول</a></p></form></main></body></html>
