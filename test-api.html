<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار CORS</title>
</head>
<body>

<h2>اختبار اتصال فرصتي</h2>
<pre id="result">جاري الاتصال...</pre>

<script>
fetch("https://forasati.ifree.page/api/test-cors.php")
.then(async response => {
    const text = await response.text();

    document.getElementById("result").textContent =
        "HTTP: " + response.status + "\n" + text;
})
.catch(error => {
    document.getElementById("result").textContent =
        "فشل الاتصال: " + error.message;
});
</script>

</body>
</html>
