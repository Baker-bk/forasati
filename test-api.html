
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار اتصال فرصتي</title>
</head>
<body>
<h2>اختبار الاتصال بقاعدة البيانات</h2>
<div id="result">جاري الاتصال...</div>
<script>
fetch("https://forasati.ifree.page/api/cors-test.php")
.then(response => response.json())
.then(data => {
    document.getElementById("result").textContent =
        JSON.stringify(data);
})
.catch(error => {
    document.getElementById("result").textContent =
        "فشل الاتصال: " + error.message;
});
</script>

</body>
</html>
