<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار CORS</title>
</head>
<body>

<h2>اختبار اتصال فرصتي</h2>
<pre id="result">جاري الاتصال...</pre>

<script>
fetch("https://forasati.ifree.page/api/test-cors.php", {
    method: "GET",
    mode: "cors"
})
.then(response => {
    document.getElementById("result").textContent =
        "Status: " + response.status;
    return response.text();
})
.then(data => {
    document.getElementById("result").textContent += "\n" + data;
})
.catch(error => {
    document.getElementById("result").textContent =
        error.name + ": " + error.message;
});
</script>

</body>
</html>
